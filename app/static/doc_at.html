<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Document — Deployable Knowledge</title>
  <link rel="stylesheet" href="/static/css/theme.css" />
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); }
    .toolbar {
      padding: 8px 12px;
      border-bottom: 1px solid var(--border);
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      background: hsl(var(--h) var(--sat) var(--l-panel));
    }
    .toolbar strong { font-size: 14px; }
    .toolbar .muted { color: var(--muted); font-size: 12px; }
    #viewer { min-height: calc(100vh - 48px); overflow: auto; }
    #pdfWrap { display: flex; flex-direction: column; align-items: center; padding: 16px; gap: 20px; }
    #pdfWrap canvas { border: 1px solid var(--border); border-radius: 8px; max-width: 100%; box-shadow: var(--shadow); }
    #textWrap { padding: 16px; max-width: 960px; margin: 0 auto; }
    #textWrap pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 13px;
      line-height: 1.5;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      background: hsl(var(--h) var(--sat) calc(var(--l-panel) + 1%)));
    }
    mark.dk-hit { background: color-mix(in oklab, var(--accent) 45%, transparent); color: var(--text); padding: 0 1px; border-radius: 2px; }
    .err { padding: 24px; color: var(--muted); }
    .excerpt-hint {
      padding: 8px 16px;
      font-size: 12px;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
      background: hsl(var(--h) var(--sat) calc(var(--l-bg) + 1%)));
      max-height: 5.5em;
      overflow: auto;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>
  <div class="toolbar">
    <strong id="docTitle">Loading…</strong>
    <span class="muted" id="docMeta"></span>
  </div>
  <div id="viewer"></div>
  <script>
(function () {
  const params = new URLSearchParams(location.search);
  const segmentId = params.get("segment");
  const viewer = document.getElementById("viewer");
  const titleEl = document.getElementById("docTitle");
  const metaEl = document.getElementById("docMeta");

  function fail(msg) {
    titleEl.textContent = "Cannot open document";
    viewer.innerHTML = "";
    const p = document.createElement("p");
    p.className = "err";
    p.textContent = String(msg);
    viewer.appendChild(p);
  }

  if (!segmentId) {
    fail("Missing segment query parameter (expected ?segment=<id>).");
    return;
  }

  function normSpace(s) {
    return String(s || "").replace(/\s+/g, " ").trim();
  }

  function parseMetaNum(v) {
    if (v == null || v === "") return null;
    const n = Number(v);
    return Number.isFinite(n) ? n : null;
  }

  async function load() {
    viewer.innerHTML = "";
    const res = await fetch("/segments/" + encodeURIComponent(segmentId), { credentials: "same-origin" });
    if (!res.ok) {
      fail(res.status === 404 ? "That passage was not found (segment may have been removed)." : "Could not load segment (" + res.status + ").");
      return;
    }
    const seg = await res.json();
    const source = seg.source || "";
    if (!source) {
      fail("Segment has no source filename.");
      return;
    }
    const docUrl = "/documents/" + encodeURIComponent(source);
    const ext = (source.split(".").pop() || "").toLowerCase();
    const pageNum = Math.max(1, parseInt(seg.page, 10) || 1);
    const startChar = parseMetaNum(seg.start_char);
    const endChar = parseMetaNum(seg.end_char);
    const excerpt = normSpace(seg.text || "").slice(0, 400);

    titleEl.textContent = source;
    metaEl.textContent = seg.page != null ? "Jump target · page " + seg.page : "";

    if (ext === "pdf") {
      if (typeof pdfjsLib === "undefined") {
        fail("PDF viewer library failed to load.");
        return;
      }
      pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
      let pdf;
      try {
        pdf = await pdfjsLib.getDocument({ url: docUrl, withCredentials: true }).promise;
      } catch (e) {
        fail("Could not open PDF. " + (e && e.message ? e.message : ""));
        return;
      }
      const total = pdf.numPages;
      const target = Math.min(Math.max(1, pageNum), total);
      const wrap = document.createElement("div");
      wrap.id = "pdfWrap";
      viewer.appendChild(wrap);

      const scale = 1.4;
      const pageObj = await pdf.getPage(target);
      const viewport = pageObj.getViewport({ scale });
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await pageObj.render({ canvasContext: ctx, viewport }).promise;

      metaEl.textContent = "Page " + target + " of " + total;
      if (excerpt) {
        const hint = document.createElement("div");
        hint.className = "excerpt-hint";
        hint.append(document.createTextNode("Cited passage: "));
        hint.append(document.createTextNode(excerpt.length > 500 ? excerpt.slice(0, 500) + "…" : excerpt));
        viewer.insertBefore(hint, wrap);
      }

      wrap.appendChild(canvas);
      canvas.scrollIntoView({ behavior: "smooth", block: "center" });
      return;
    }

    const textLike = new Set(["txt", "md", "markdown", "html", "htm", "csv", "json", "log", "xml"]);
    if (!textLike.has(ext)) {
      titleEl.textContent = source || "Document";
      metaEl.textContent = "";
      const p = document.createElement("p");
      p.className = "err";
      p.append(document.createTextNode("No in-app viewer for ." + ext + " — "));
      const a = document.createElement("a");
      a.href = docUrl;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "open original file";
      p.appendChild(a);
      viewer.appendChild(p);
      return;
    }

    /* Plain text and similar */
    let text;
    try {
      const tr = await fetch(docUrl, { credentials: "same-origin" });
      if (!tr.ok) {
        fail("Could not load file (" + tr.status + ").");
        return;
      }
      text = await tr.text();
    } catch (e) {
      fail("Could not load file. " + (e && e.message ? e.message : ""));
      return;
    }

    const wrap = document.createElement("div");
    wrap.id = "textWrap";
    const pre = document.createElement("pre");
    const safeStart = startChar != null && endChar != null && startChar >= 0 && endChar > startChar && endChar <= text.length;
    if (safeStart) {
      const before = text.slice(0, startChar);
      const mid = text.slice(startChar, endChar);
      const after = text.slice(endChar);
      pre.append(document.createTextNode(before));
      const mark = document.createElement("mark");
      mark.className = "dk-hit";
      mark.append(document.createTextNode(mid));
      pre.append(mark, document.createTextNode(after));
      metaEl.textContent = "Highlighted passage · characters " + startChar + "–" + endChar;
    } else if (excerpt.length >= 4) {
      const idx = text.indexOf(excerpt.slice(0, Math.min(200, excerpt.length)));
      if (idx >= 0) {
        const take = Math.min(excerpt.length, 400);
        const before = text.slice(0, idx);
        const mid = text.slice(idx, idx + take);
        const after = text.slice(idx + take);
        pre.append(document.createTextNode(before));
        const mark = document.createElement("mark");
        mark.className = "dk-hit";
        mark.append(document.createTextNode(mid));
        pre.append(mark, document.createTextNode(after));
        metaEl.textContent = "Highlighted best text match in file.";
      } else {
        pre.textContent = text;
        metaEl.textContent = "Opened full file (no exact offset match for this passage).";
      }
    } else {
      pre.textContent = text;
      metaEl.textContent = "Opened full file.";
    }
    wrap.appendChild(pre);
    viewer.appendChild(wrap);
    const hit = pre.querySelector("mark.dk-hit");
    if (hit) hit.scrollIntoView({ behavior: "smooth", block: "center" });
  }

  load();
})();
  </script>
</body>
</html>
