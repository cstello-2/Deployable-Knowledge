<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D Knowledge Universe — Deployable Knowledge</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #05070d; color: #e6edf3; font-family: system-ui, sans-serif; }
    #scene { display: block; width: 100vw; height: 100vh; cursor: crosshair; }
    #hud { position: fixed; left: 14px; bottom: 14px; font-size: 14px; color: #9fd0ff; text-shadow: 0 1px 3px #000; pointer-events: none; }
    #status { position: fixed; left: 14px; top: 12px; font-size: 12px; color: #6b7a8d; pointer-events: none; }
    #crosshair { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); color: #ffffff; opacity: 0.5; font-size: 18px; pointer-events: none; }
    #hint {
      position: fixed; left: 50%; bottom: 48px; transform: translateX(-50%);
      background: rgba(10, 18, 30, 0.78); border: 1px solid #1d2b42; border-radius: 10px;
      padding: 10px 16px; font-size: 13px; color: #c7d6e6; text-align: center; pointer-events: none;
    }
    #hint b { color: #fff; }
    .legend { position: fixed; right: 14px; top: 12px; font-size: 12px; color: #9fb0c2; text-align: right; pointer-events: none; }
    .legend i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-left: 8px; }
  </style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="status">starting…</div>
  <div class="legend">
    <span>entity<i style="background:#4f9cf0"></i></span>
    <span>acronym<i style="background:#3fb27f"></i></span>
    <span>measure<i style="background:#e0a23c"></i></span>
  </div>
  <div id="crosshair">✛</div>
  <div id="hud"></div>
  <div id="hint"><b>Click to enter</b> · <b>W A S D</b> / arrow keys to fly · <b>mouse</b> to look · <b>Space</b>/<b>Shift</b> up/down · <b>scroll</b> = speed · <b>Esc</b> to release</div>
  <!-- vendored offline 📴 — three.js, no CDN -->
  <script src="/static/js/vendor/three.min.js"></script>
  <script src="/static/graph3d.js"></script>
</body>
</html>
