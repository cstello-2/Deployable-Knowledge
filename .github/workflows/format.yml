name: Format

on: [push]

jobs:
  black:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.13"
    - name: Install Black
      run: |
        python -m pip install --upgrade pip
        python -m pip install black
    - name: Check formatting
      run: |
        python -m black --check --diff app api core tests sandbox/session_debug config.py
