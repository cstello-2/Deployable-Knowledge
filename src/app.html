<!doctype html>
<html lang="en" data-theme="%dk.themeColor%" data-mode="%dk.themeMode%">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// The server already stamped the stored theme onto <html>; only "system"
			// still needs resolving here, because the OS preference is client-only.
			(() => {
				const root = document.documentElement;
				const dark =
					root.dataset.mode === 'dark' ||
					(root.dataset.mode === 'system' &&
						window.matchMedia('(prefers-color-scheme: dark)').matches);

				root.classList.toggle('dark', dark);
				root.style.colorScheme = dark ? 'dark' : 'light';
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
