<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1540" viewBox="0 0 1800 1540">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700}.subtitle{font-size:22px;fill:#58677f}.section{font-size:25px;font-weight:700}.bt{font-size:19px;font-weight:700}.body{font-size:15px;fill:#4d5b70}.small{font-size:13px;fill:#59687e}.label{font-size:13px;font-weight:700;fill:#526177}.panel{stroke-width:2;rx:20}.box{stroke-width:2.5;rx:16}.green{fill:#eaf8ef;stroke:#32a35d}.purple{fill:#f1eaff;stroke:#8253de}.amber{fill:#fff7e5;stroke:#d99a16}.red{fill:#fff0f2;stroke:#e6576a}.white{fill:#fff;stroke:#a7b3c5}.arrow{fill:none;stroke:#66758b;stroke-width:3;marker-end:url(#a)}.gArrow{fill:none;stroke:#299454;stroke-width:3;marker-end:url(#g)}.pArrow{fill:none;stroke:#8050d9;stroke-width:3;marker-end:url(#p)}.rArrow{fill:none;stroke:#d94e62;stroke-width:3;marker-end:url(#r)}
    </style>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66758b"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#299454"/></marker>
    <marker id="p" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8050d9"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d94e62"/></marker>
  </defs>
  <rect width="1800" height="1540" fill="#f7f8fb"/>
  <text x="60" y="72" class="title">Query, Retrieval &amp; Answer Implementation</text>
  <text x="60" y="110" class="subtitle">Standard retrieval and graph-native evidence paths converge into one grounded LLM response</text>

  <rect x="635" y="145" width="530" height="105" class="box white"/>
  <text x="663" y="184" class="bt">User query · retrieveRagContext()</text>
  <text x="663" y="216" class="body">Question + selected documents + retrieval mode</text>

  <rect x="45" y="300" width="830" height="690" class="panel green" fill-opacity=".18"/>
  <text x="75" y="345" class="section">1. Traditional retrieval</text>

  <rect x="85" y="400" width="335" height="145" class="box green"/>
  <text x="110" y="438" class="bt">Semantic search</text>
  <text x="110" y="470" class="body">Xenova/all-MiniLM-L6-v2 (q8)</text>
  <text x="110" y="496" class="body">Transformers.js query embedding</text>
  <text x="110" y="522" class="body">Cosine-ready normalized vectors</text>

  <rect x="500" y="400" width="335" height="145" class="box green"/>
  <text x="525" y="438" class="bt">BM25 keyword search</text>
  <text x="525" y="470" class="body">wink-bm25-text-search</text>
  <text x="525" y="496" class="body">stemmer · stopword</text>
  <text x="525" y="522" class="body">Index built from SQLite chunks</text>

  <rect x="235" y="625" width="450" height="175" class="box green"/>
  <text x="260" y="663" class="bt">Hybrid candidate merge + BERT reranker</text>
  <text x="260" y="695" class="body">reRankData()</text>
  <text x="260" y="721" class="body">Xenova/ms-marco-MiniLM-L-6-v2</text>
  <text x="260" y="747" class="body">MiniLM / BERT-family cross-encoder</text>
  <text x="260" y="773" class="body">Fallback: fused semantic + BM25 scores</text>
  <path d="M252 545 V585 H405 V625" class="gArrow"/><path d="M668 545 V585 H515 V625" class="gArrow"/>

  <rect x="235" y="855" width="450" height="100" class="box amber"/>
  <text x="260" y="893" class="bt">Traditional ranked results</text>
  <text x="260" y="925" class="body">Top chunks + normalized relevance [0,1]</text>
  <path d="M460 800 V855" class="gArrow"/>
  <path d="M685 905 H900 V712 H1060" class="pArrow"/>
  <text x="700" y="890" class="label">hybrid seed handoff</text>

  <rect x="925" y="300" width="830" height="690" class="panel purple" fill-opacity=".16"/>
  <text x="955" y="345" class="section">2. Knowledge Graph retrieval</text>

  <rect x="965" y="400" width="340" height="145" class="box purple"/>
  <text x="990" y="438" class="bt">Load / require GraphStore</text>
  <text x="990" y="470" class="body">getBuiltKnowledgeGraph()</text>
  <text x="990" y="496" class="body">Memory cache or SQLite snapshot</text>
  <text x="990" y="522" class="body">Signature-valid; never auto-builds</text>

  <rect x="1375" y="400" width="340" height="145" class="box purple"/>
  <text x="1400" y="438" class="bt">Combined seed sources</text>
  <text x="1400" y="470" class="body">1. Hybrid ranked chunks</text>
  <text x="1400" y="496" class="body">2. Exact entity-label matches</text>
  <text x="1400" y="522" class="body">3. Fuzzy entity-label matches</text>

  <rect x="1060" y="625" width="555" height="175" class="box purple"/>
  <text x="1085" y="663" class="bt">Merge, deduplicate + rank seeds</text>
  <text x="1085" y="695" class="body">selectGraphSeedCandidates()</text>
  <text x="1085" y="721" class="body">Hybrid: 70% score + 30% rank · exact ≤ 1.0</text>
  <text x="1085" y="747" class="body">Fuzzy: normalized Levenshtein ≥ 0.84, capped 0.75</text>
  <text x="1085" y="773" class="body">Caps: 12 hybrid · 8 exact · 5 fuzzy · 20 total</text>
  <path d="M1135 545 V585 H1250 V625" class="pArrow"/><path d="M1545 545 V585 H1425 V625" class="pArrow"/>

  <rect x="965" y="855" width="340" height="100" class="box purple"/>
  <text x="990" y="893" class="bt">LightRAG neighborhoods</text>
  <text x="990" y="925" class="body">lightRagSearch() · connected evidence</text>
  <rect x="1375" y="855" width="340" height="100" class="box purple"/>
  <text x="1400" y="893" class="bt">PathRAG traversal</text>
  <text x="1400" y="925" class="body">pathRagSearch() · graph paths</text>
  <path d="M1337 800 V825 H1135 V855" class="pArrow"/><path d="M1337 825 H1545 V855" class="pArrow"/>

  <path d="M900 250 V275 H252 V400" class="gArrow"/><path d="M900 275 H668 V400" class="gArrow"/><path d="M900 250 V275 H1135 V400" class="pArrow"/><path d="M900 275 H1545 V400" class="pArrow"/>
  <text x="275" y="290" class="label">semantic</text><text x="690" y="290" class="label">BM25</text><text x="1160" y="290" class="label">graph mode</text>

  <rect x="45" y="1035" width="1710" height="410" class="panel red" fill-opacity=".13"/>
  <text x="75" y="1080" class="section">3. Context creation and final answer</text>

  <rect x="85" y="1140" width="290" height="130" class="box red"/>
  <text x="110" y="1178" class="bt">Retrieved evidence</text>
  <text x="110" y="1210" class="body">Standard top chunks [0,1]</text>
  <text x="110" y="1236" class="body">KG chunks + graph paths [0,1]</text>

  <rect x="435" y="1140" width="290" height="130" class="box red"/>
  <text x="460" y="1178" class="bt">Context + prompt</text>
  <text x="460" y="1210" class="body">Title, page, chunk, sources</text>
  <text x="460" y="1236" class="body">Question + chat history</text>

  <rect x="785" y="1140" width="385" height="130" class="box red"/>
  <text x="810" y="1178" class="bt">LLM provider</text>
  <text x="810" y="1210" class="body">Ollama API · llama3:latest (local)</text>
  <text x="810" y="1236" class="body">Optional GitHub Models · openai/gpt-4.1</text>

  <rect x="1230" y="1140" width="275" height="130" class="box red"/>
  <text x="1255" y="1178" class="bt">Stream final answer</text>
  <text x="1255" y="1210" class="body">Generated tokens</text>
  <text x="1255" y="1236" class="body">Answer + citations</text>

  <rect x="1560" y="1140" width="155" height="130" class="box amber"/>
  <text x="1582" y="1178" class="bt">SQLite</text>
  <text x="1582" y="1210" class="body">session_</text>
  <text x="1582" y="1236" class="body">messages</text>
  <path d="M375 1205 H435" class="rArrow"/><path d="M725 1205 H785" class="rArrow"/><path d="M1170 1205 H1230" class="rArrow"/><path d="M1505 1205 H1560" class="rArrow"/>

  <path d="M460 955 V1010 H230 V1140" class="gArrow"/><path d="M1135 955 V1010 H230" class="pArrow"/><path d="M1545 955 V1010 H230" class="pArrow"/>

  <rect x="45" y="1470" width="1710" height="45" rx="15" fill="#fff" stroke="#cbd4e1" stroke-width="2"/>
  <text x="75" y="1499" class="body">Colors: green = traditional retrieval · purple = Knowledge Graph retrieval · red = answer generation · amber = persistent storage</text>
</svg>
