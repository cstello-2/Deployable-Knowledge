<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="2300" viewBox="0 0 1800 2300">
  <defs>
    <style>
      .bg { fill: #f7f8fb; }
      .title { font: 700 44px Arial, sans-serif; fill: #172033; }
      .subtitle { font: 400 22px Arial, sans-serif; fill: #516078; }
      .section-title { font: 700 24px Arial, sans-serif; fill: #24324a; }
      .box-title { font: 700 19px Arial, sans-serif; fill: #172033; }
      .box-text { font: 400 15px Arial, sans-serif; fill: #3f4d63; }
      .arrow-label { font: 700 13px Arial, sans-serif; fill: #48566d; }
      .small { font: 400 13px Arial, sans-serif; fill: #516078; }
      .note { font: 700 15px Arial, sans-serif; fill: #884900; }
      .store { fill: #fff8e6; stroke: #d29a23; stroke-width: 2.5; }
      .ingest { fill: #eaf3ff; stroke: #3f82d9; stroke-width: 2.5; }
      .trad { fill: #eaf8ef; stroke: #39a35b; stroke-width: 2.5; }
      .kg { fill: #f1eaff; stroke: #8054d8; stroke-width: 2.5; }
      .answer { fill: #fff0f1; stroke: #d85163; stroke-width: 2.5; }
      .neutral { fill: #ffffff; stroke: #9aa8bd; stroke-width: 2; }
      .panel { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2; }
      .panel-blue { fill: #eef6ff; stroke: #98bdf0; stroke-width: 2; }
      .panel-green { fill: #effaf3; stroke: #96d7aa; stroke-width: 2; }
      .panel-purple { fill: #f6f0ff; stroke: #b8a1ed; stroke-width: 2; }
      .panel-red { fill: #fff4f5; stroke: #ef9ca8; stroke-width: 2; }
      .arrow { fill: none; stroke: #5e6d82; stroke-width: 2.5; marker-end: url(#arrow); }
      .arrow-green { fill: none; stroke: #20864a; stroke-width: 2.8; marker-end: url(#arrow-green); }
      .arrow-purple { fill: none; stroke: #7044c7; stroke-width: 2.8; marker-end: url(#arrow-purple); }
      .arrow-red { fill: none; stroke: #c24155; stroke-width: 2.8; marker-end: url(#arrow-red); }
      .dashed { fill: none; stroke: #7b8798; stroke-width: 3; stroke-dasharray: 10 10; }
      .boundary { stroke: #1f2937; stroke-width: 4; stroke-dasharray: 14 12; }
    </style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#5e6d82"/>
    </marker>
    <marker id="arrow-green" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#20864a"/>
    </marker>
    <marker id="arrow-purple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#7044c7"/>
    </marker>
    <marker id="arrow-red" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#c24155"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1800" height="2300"/>
  <text class="title" x="70" y="72">Deployable Knowledge Retrieval Architecture</text>
  <text class="subtitle" x="70" y="110">Explicit graph construction, combined seed selection, traditional retrieval, and final LLM answer flow</text>

  <!-- Panels -->
  <rect class="panel-blue" x="60" y="150" width="1680" height="520" rx="18"/>
  <text class="section-title" x="90" y="190">1. Document Ingestion and Local Storage</text>

  <rect class="panel-green" x="60" y="720" width="790" height="850" rx="18"/>
  <text class="section-title" x="90" y="760">2. Traditional Retrieval Pipelines</text>

  <rect class="panel-purple" x="950" y="720" width="790" height="850" rx="18"/>
  <text class="section-title" x="980" y="760">3. Manual Knowledge Graph Build and Retrieval</text>

  <line class="boundary" x1="900" y1="710" x2="900" y2="1585"/>

  <rect class="panel-red" x="60" y="1620" width="1680" height="500" rx="18"/>
  <text class="section-title" x="90" y="1660">4. Context Creation and Final Answer</text>

  <!-- Ingestion boxes -->
  <rect class="ingest" x="100" y="235" width="230" height="105" rx="14"/>
  <text class="box-title" x="125" y="270">PDF Corpus</text>
  <text class="box-text" x="125" y="297">documents/corpus</text>
  <text class="box-text" x="125" y="319">Local PDF files</text>

  <rect class="ingest" x="395" y="235" width="250" height="105" rx="14"/>
  <text class="box-title" x="420" y="270">PDF Reader / OCR</text>
  <text class="box-text" x="420" y="297">scribe.js-ocr</text>
  <text class="box-text" x="420" y="319">native text, OCR, tables</text>

  <rect class="ingest" x="710" y="235" width="250" height="105" rx="14"/>
  <text class="box-title" x="735" y="270">Extracted Pages</text>
  <text class="box-text" x="735" y="297">TEXT / IMAGE / TABLE</text>
  <text class="box-text" x="735" y="319">page-level content</text>

  <rect class="ingest" x="1025" y="235" width="250" height="105" rx="14"/>
  <text class="box-title" x="1050" y="270">Semantic Chunker</text>
  <text class="box-text" x="1050" y="297">sentence splitting</text>
  <text class="box-text" x="1050" y="319">overlap + metadata</text>

  <rect class="ingest" x="1340" y="235" width="300" height="105" rx="14"/>
  <text class="box-title" x="1365" y="270">Embedding Model</text>
  <text class="box-text" x="1365" y="297">Xenova/all-MiniLM-L6-v2</text>
  <text class="box-text" x="1365" y="319">@huggingface/transformers</text>

  <rect class="store" x="725" y="465" width="350" height="130" rx="14"/>
  <text class="box-title" x="760" y="502">SQLite app.db</text>
  <text class="box-text" x="760" y="531">documents table</text>
  <text class="box-text" x="760" y="555">document_chunks table</text>
  <text class="box-text" x="760" y="579">chunk text + embeddings + metadata</text>

  <rect class="store" x="1135" y="465" width="260" height="130" rx="14"/>
  <text class="box-title" x="1160" y="502">Seed DB</text>
  <text class="box-text" x="1160" y="531">app.db.seed</text>
  <text class="box-text" x="1160" y="555">prebuilt local corpus</text>
  <text class="box-text" x="1160" y="579">restorable snapshot</text>

  <!-- Ingestion arrows -->
  <path class="arrow" d="M330 287 H395"/>
  <text class="arrow-label" x="342" y="274">PDF files</text>
  <path class="arrow" d="M645 287 H710"/>
  <text class="arrow-label" x="655" y="274">page text</text>
  <path class="arrow" d="M960 287 H1025"/>
  <text class="arrow-label" x="973" y="274">clean text</text>
  <path class="arrow" d="M1275 287 H1340"/>
  <text class="arrow-label" x="1284" y="274">sentences</text>
  <path class="arrow" d="M1490 340 V415 H1025 V465 H900"/>
  <text class="arrow-label" x="1364" y="405">embeddings</text>
  <path class="arrow" d="M1150 340 V420 H900 V465"/>
  <text class="arrow-label" x="930" y="405">chunks + metadata</text>
  <path class="arrow" d="M1075 530 H1135"/>
  <text class="arrow-label" x="1088" y="516">snapshot</text>

  <!-- User query -->
  <rect class="neutral" x="690" y="630" width="420" height="80" rx="18"/>
  <text class="box-title" x="725" y="664">User Query</text>
  <text class="box-text" x="725" y="690">question text enters retrieveRagContext()</text>

  <!-- Traditional retrieval boxes -->
  <rect class="trad" x="110" y="810" width="220" height="95" rx="14"/>
  <text class="box-title" x="135" y="845">Semantic Search</text>
  <text class="box-text" x="135" y="872">embed query</text>
  <text class="box-text" x="135" y="894">compare vectors</text>

  <rect class="trad" x="110" y="990" width="220" height="95" rx="14"/>
  <text class="box-title" x="135" y="1025">BM25 Search</text>
  <text class="box-text" x="135" y="1052">keyword ranking</text>
  <text class="box-text" x="135" y="1074">wink-bm25</text>

  <rect class="trad" x="110" y="1170" width="220" height="95" rx="14"/>
  <text class="box-title" x="135" y="1205">Hybrid Search</text>
  <text class="box-text" x="135" y="1232">semantic + BM25</text>
  <text class="box-text" x="135" y="1254">merge candidates</text>

  <rect class="neutral" x="405" y="810" width="310" height="95" rx="14"/>
  <text class="box-title" x="430" y="845">Query Embedding</text>
  <text class="box-text" x="430" y="872">MiniLM turns query text</text>
  <text class="box-text" x="430" y="894">into vector</text>

  <rect class="neutral" x="405" y="990" width="310" height="95" rx="14"/>
  <text class="box-title" x="430" y="1025">Text Index In Memory</text>
  <text class="box-text" x="430" y="1052">tokens, stopwords, stemming</text>
  <text class="box-text" x="430" y="1074">built from SQLite chunks</text>

  <rect class="neutral" x="405" y="1170" width="310" height="95" rx="14"/>
  <text class="box-title" x="430" y="1205">Rerank / Fusion</text>
  <text class="box-text" x="430" y="1232">optional cross-reranker</text>
  <text class="box-text" x="430" y="1254">fallback fused scoring</text>

  <rect class="store" x="280" y="1380" width="380" height="95" rx="14"/>
  <text class="box-title" x="305" y="1415">Traditional Results</text>
  <text class="box-text" x="305" y="1442">ranked chunks + scores</text>
  <text class="box-text" x="305" y="1464">semantic / BM25 / hybrid</text>

  <!-- Traditional arrows -->
  <path class="arrow-green" d="M800 710 V785 H220 V810"/>
  <text class="arrow-label" x="250" y="782">mode = semantic</text>
  <path class="arrow-green" d="M800 710 V965 H220 V990"/>
  <text class="arrow-label" x="250" y="962">mode = BM25</text>
  <path class="arrow-green" d="M800 710 V1145 H220 V1170"/>
  <text class="arrow-label" x="250" y="1142">mode = hybrid</text>

  <path class="arrow-green" d="M330 857 H405"/>
  <text class="arrow-label" x="345" y="842">query text</text>
  <path class="arrow-green" d="M330 1037 H405"/>
  <text class="arrow-label" x="345" y="1022">query text</text>
  <path class="arrow-green" d="M330 1217 H405"/>
  <text class="arrow-label" x="345" y="1202">candidate chunks</text>

  <path class="arrow" d="M725 530 C575 620, 560 720, 560 810"/>
  <text class="arrow-label" x="585" y="700">stored vectors</text>
  <path class="arrow" d="M805 595 C760 780, 610 905, 560 990"/>
  <text class="arrow-label" x="688" y="830">chunk text</text>
  <path class="arrow-green" d="M560 905 V965"/>
  <text class="arrow-label" x="578" y="940">similarity scores</text>
  <path class="arrow-green" d="M560 1085 V1145"/>
  <text class="arrow-label" x="578" y="1120">BM25 scores</text>
  <path class="arrow-green" d="M560 1265 V1380"/>
  <text class="arrow-label" x="578" y="1335">ranked chunks</text>

  <!-- Explicit KG build lifecycle -->
  <rect class="neutral" x="990" y="810" width="260" height="95" rx="14"/>
  <text class="box-title" x="1015" y="845">Build Knowledge Graph</text>
  <text class="box-text" x="1015" y="872">Document Library button</text>
  <text class="box-text" x="1015" y="894">POST /knowledge-graph</text>

  <rect class="kg" x="1330" y="810" width="330" height="95" rx="14"/>
  <text class="box-title" x="1355" y="845">Build Status Registry</text>
  <text class="box-text" x="1355" y="872">not built / building / built / failed</text>
  <text class="box-text" x="1355" y="894">deduplicates concurrent builds</text>

  <rect class="kg" x="990" y="990" width="260" height="95" rx="14"/>
  <text class="box-title" x="1015" y="1025">Read Stored Chunks</text>
  <text class="box-text" x="1015" y="1052">selected documents</text>
  <text class="box-text" x="1015" y="1074">document_chunks from SQLite</text>

  <rect class="kg" x="1330" y="990" width="330" height="95" rx="14"/>
  <text class="box-title" x="1355" y="1025">Extract Graph Structure</text>
  <text class="box-text" x="1355" y="1052">entities: terms, acronyms, names</text>
  <text class="box-text" x="1355" y="1074">relations: rules + co-occurrence</text>

  <rect class="store" x="990" y="1170" width="260" height="95" rx="14"/>
  <text class="box-title" x="1015" y="1205">GraphStore Cache</text>
  <text class="box-text" x="1015" y="1232">in-memory nodes + edges</text>
  <text class="box-text" x="1015" y="1254">reused by later queries</text>

  <rect class="kg" x="1330" y="1170" width="330" height="95" rx="14"/>
  <text class="box-title" x="1355" y="1205">Scope + Staleness Check</text>
  <text class="box-text" x="1355" y="1232">document IDs + updatedAt</text>
  <text class="box-text" x="1355" y="1254">graph build version signature</text>

  <!-- KG build arrows -->
  <path class="arrow-purple" d="M1250 857 H1330"/>
  <text class="arrow-label" x="1262" y="842">start build</text>
  <path class="arrow-purple" d="M1495 905 V950 H1120 V990"/>
  <text class="arrow-label" x="1270" y="940">explicit construction</text>
  <path class="arrow" d="M1075 530 C1280 615, 1120 820, 1120 990"/>
  <text class="arrow-label" x="1138" y="930">SQLite rows</text>
  <path class="arrow-purple" d="M1250 1037 H1330"/>
  <text class="arrow-label" x="1262" y="1022">chunk text</text>
  <path class="arrow-purple" d="M1495 1085 V1125 H1120 V1170"/>
  <text class="arrow-label" x="1260" y="1115">nodes + edges</text>
  <path class="arrow-purple" d="M1250 1217 H1330"/>
  <text class="arrow-label" x="1263" y="1202">built signature</text>

  <!-- Combined KG seed selection -->
  <rect class="kg" x="990" y="1360" width="260" height="115" rx="14"/>
  <text class="box-title" x="1015" y="1395">Combined Seed Sources</text>
  <text class="box-text" x="1015" y="1422">1. hybrid chunks + scores</text>
  <text class="box-text" x="1015" y="1444">2. exact entity labels</text>
  <text class="box-text" x="1015" y="1466">3. fuzzy entity labels</text>

  <rect class="kg" x="1330" y="1360" width="330" height="115" rx="14"/>
  <text class="box-title" x="1355" y="1395">Merge, Dedupe, and Rank</text>
  <text class="box-text" x="1355" y="1422">hybrid score + rank normalization</text>
  <text class="box-text" x="1355" y="1444">exact 1.0 / 0.95; fuzzy threshold 0.84</text>
  <text class="box-text" x="1355" y="1466">source caps + deterministic ordering</text>

  <rect class="kg" x="1075" y="1510" width="500" height="95" rx="14"/>
  <text class="box-title" x="1100" y="1545">Graph Traversal and Evidence Ranking</text>
  <text class="box-text" x="1100" y="1572">LightRAG neighborhoods + PathRAG paths</text>
  <text class="box-text" x="1100" y="1594">top graph chunks, sources, and relational paths</text>

  <!-- Query and seed arrows: queries require a built graph, never trigger a build -->
  <path class="arrow-purple" d="M1000 710 V780 H970 V1418 H990"/>
  <text class="arrow-label" x="1015" y="792">mode = graph; require built status</text>
  <path class="arrow-purple" d="M660 1428 C790 1428, 870 1418, 990 1418"/>
  <text class="arrow-label" x="725" y="1412">hybrid ranked chunks</text>
  <path class="arrow-purple" d="M1120 1265 V1360"/>
  <text class="arrow-label" x="1135" y="1320">cached entity labels</text>
  <path class="arrow-purple" d="M1250 1418 H1330"/>
  <text class="arrow-label" x="1262" y="1403">candidate seeds</text>
  <path class="arrow-purple" d="M1495 1475 V1492 H1325 V1510"/>
  <text class="arrow-label" x="1380" y="1496">ranked seeds</text>
  <path class="arrow-purple" d="M1120 1265 V1305 H965 V1558 H1075"/>
  <text class="arrow-label" x="980" y="1544">cached graph</text>

  <!-- Answer boxes -->
  <rect class="answer" x="125" y="1720" width="300" height="105" rx="14"/>
  <text class="box-title" x="150" y="1755">Retrieved Results</text>
  <text class="box-text" x="150" y="1782">top chunks + scores</text>
  <text class="box-text" x="150" y="1804">optional graph paths</text>

  <rect class="answer" x="500" y="1720" width="300" height="105" rx="14"/>
  <text class="box-title" x="525" y="1755">Context Block</text>
  <text class="box-text" x="525" y="1782">title, page, chunk</text>
  <text class="box-text" x="525" y="1804">retrieved content</text>

  <rect class="answer" x="875" y="1720" width="300" height="105" rx="14"/>
  <text class="box-title" x="900" y="1755">Prompt Builder</text>
  <text class="box-text" x="900" y="1782">question + context</text>
  <text class="box-text" x="900" y="1804">chat history + instructions</text>

  <rect class="answer" x="1250" y="1720" width="300" height="105" rx="14"/>
  <text class="box-title" x="1275" y="1755">Ollama LLM</text>
  <text class="box-text" x="1275" y="1782">llama3:latest</text>
  <text class="box-text" x="1275" y="1804">local answer generation</text>

  <rect class="answer" x="685" y="1945" width="430" height="105" rx="14"/>
  <text class="box-title" x="725" y="1980">Final Answer</text>
  <text class="box-text" x="725" y="2007">streamed response to user</text>
  <text class="box-text" x="725" y="2029">sources saved with chat metadata</text>

  <rect class="store" x="1230" y="1945" width="330" height="105" rx="14"/>
  <text class="box-title" x="1260" y="1980">SQLite Chat Storage</text>
  <text class="box-text" x="1260" y="2007">session_messages</text>
  <text class="box-text" x="1260" y="2029">answer + source metadata</text>

  <path class="arrow-red" d="M470 1475 V1675 H275 V1720"/>
  <text class="arrow-label" x="298" y="1670">traditional top chunks</text>
  <path class="arrow-red" d="M1325 1605 V1675 H275 V1720"/>
  <text class="arrow-label" x="1110" y="1670">KG top chunks + graph paths</text>
  <path class="arrow-red" d="M425 1772 H500"/>
  <text class="arrow-label" x="440" y="1758">format</text>
  <path class="arrow-red" d="M800 1772 H875"/>
  <text class="arrow-label" x="812" y="1758">context text</text>
  <path class="arrow-red" d="M1175 1772 H1250"/>
  <text class="arrow-label" x="1188" y="1758">prompt</text>
  <path class="arrow-red" d="M1400 1825 V1945 H1115"/>
  <text class="arrow-label" x="1240" y="1908">generated tokens</text>
  <path class="arrow-red" d="M1115 1998 H1230"/>
  <text class="arrow-label" x="1138" y="1983">answer + sources</text>

  <!-- Legend -->
  <rect class="panel" x="60" y="2155" width="1680" height="95" rx="18"/>
  <text class="section-title" x="90" y="2192">Legend</text>
  <rect class="ingest" x="200" y="2174" width="38" height="24" rx="6"/><text class="small" x="250" y="2193">Ingestion / parsing / chunking</text>
  <rect class="store" x="500" y="2174" width="38" height="24" rx="6"/><text class="small" x="550" y="2193">Persistent SQLite or seed storage</text>
  <rect class="trad" x="820" y="2174" width="38" height="24" rx="6"/><text class="small" x="870" y="2193">Traditional retrieval</text>
  <rect class="kg" x="1080" y="2174" width="38" height="24" rx="6"/><text class="small" x="1130" y="2193">Knowledge Graph retrieval</text>
  <rect class="answer" x="1390" y="2174" width="38" height="24" rx="6"/><text class="small" x="1440" y="2193">LLM answer path</text>
  <text class="small" x="90" y="2230">Key idea: the graph is built explicitly for the selected document scope, reused until its signature changes, and queried with hybrid + exact-label + fuzzy-label seeds.</text>
</svg>
