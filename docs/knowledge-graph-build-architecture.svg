<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1380" viewBox="0 0 1800 1380">
  <defs>
    <style>
      text{font-family:Arial,Helvetica,sans-serif;fill:#172033}.title{font-size:44px;font-weight:700}.subtitle{font-size:22px;fill:#58677f}.section{font-size:25px;font-weight:700}.bt{font-size:19px;font-weight:700}.body{font-size:15px;fill:#4d5b70}.small{font-size:13px;fill:#59687e}.label{font-size:13px;font-weight:700;fill:#526177}.panel{stroke-width:2;rx:20}.box{stroke-width:2.5;rx:16}.blue{fill:#eaf3ff;stroke:#4387df}.amber{fill:#fff7e5;stroke:#d99a16}.purple{fill:#f1eaff;stroke:#8253de}.green{fill:#eaf8ef;stroke:#32a35d}.white{fill:#fff;stroke:#a7b3c5}.status{fill:#f8fbff;stroke:#7b91ad}.arrow{fill:none;stroke:#66758b;stroke-width:3;marker-end:url(#arrow)}.purpleArrow{fill:none;stroke:#8050d9;stroke-width:3;marker-end:url(#arrowPurple)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#66758b"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#8050d9"/></marker>
  </defs>
  <rect width="1800" height="1380" fill="#f7f8fb"/>
  <text x="60" y="72" class="title">Ingestion &amp; Knowledge Graph Build Implementation</text>
  <text x="60" y="110" class="subtitle">Selected-document processing, persistent retrieval storage, and restart-safe graph construction</text>

  <rect x="45" y="145" width="1710" height="455" class="panel blue" fill-opacity=".35"/>
  <text x="75" y="190" class="section">1. Document ingestion and persistent storage</text>

  <rect x="75" y="245" width="230" height="150" class="box blue"/>
  <text x="98" y="282" class="bt">PDF upload / selection</text>
  <text x="98" y="316" class="body">Local corpus or browser upload</text>
  <text x="98" y="344" class="body">Source: PDF files</text>

  <rect x="365" y="245" width="270" height="150" class="box blue"/>
  <text x="388" y="282" class="bt">PDF reader + OCR</text>
  <text x="388" y="314" class="body">TextExtract()</text>
  <text x="388" y="340" class="body">pdfjs-dist · scribe.js-ocr</text>
  <text x="388" y="366" class="body">sharp image preprocessing</text>

  <rect x="695" y="245" width="250" height="150" class="box blue"/>
  <text x="718" y="282" class="bt">Extracted pages</text>
  <text x="718" y="314" class="body">TEXT · IMAGE · TABLE</text>
  <text x="718" y="340" class="body">Page text + metadata</text>

  <rect x="1005" y="245" width="275" height="150" class="box blue"/>
  <text x="1028" y="282" class="bt">Semantic chunker</text>
  <text x="1028" y="314" class="body">chunkPages() · assembleChunks()</text>
  <text x="1028" y="340" class="body">Sentence boundaries, overlap</text>
  <text x="1028" y="366" class="body">Chunk/page/source metadata</text>

  <rect x="1340" y="245" width="350" height="150" class="box blue"/>
  <text x="1363" y="282" class="bt">Embedding model</text>
  <text x="1363" y="314" class="body">Xenova/all-MiniLM-L6-v2 (q8)</text>
  <text x="1363" y="340" class="body">Hugging Face Transformers.js</text>
  <text x="1363" y="366" class="body">Mean pooling + normalization</text>

  <path d="M305 320 H365" class="arrow"/><path d="M635 320 H695" class="arrow"/><path d="M945 320 H1005" class="arrow"/><path d="M1280 320 H1340" class="arrow"/>
  <text x="318" y="304" class="label">PDF</text><text x="648" y="304" class="label">pages</text><text x="958" y="304" class="label">text</text><text x="1290" y="304" class="label">chunks</text>

  <rect x="615" y="450" width="570" height="110" class="box amber"/>
  <text x="642" y="487" class="bt">SQLite / libSQL database · Drizzle ORM</text>
  <text x="642" y="518" class="body">storeDocumentChunks() → documents + document_chunks</text>
  <text x="642" y="544" class="body">Chunk text, embeddings, page/source metadata, updatedAt</text>
  <path d="M1142 395 V425 H900 V450" class="arrow"/><path d="M1515 395 V425 H900" class="arrow"/>
  <path d="M900 560 V610 H1170 V735" class="arrow"/>
  <text x="925" y="600" class="label">selected stored chunks</text>

  <rect x="45" y="635" width="1710" height="610" class="panel purple" fill-opacity=".20"/>
  <text x="75" y="680" class="section">2. Manual Knowledge Graph build</text>

  <rect x="75" y="735" width="240" height="135" class="box white"/>
  <text x="98" y="772" class="bt">Selected documents</text>
  <text x="98" y="805" class="body">Document Library scope (required)</text>
  <text x="98" y="831" class="body">No selection → build disabled</text>

  <rect x="370" y="735" width="255" height="135" class="box green"/>
  <text x="393" y="772" class="bt">Build KG button</text>
  <text x="393" y="805" class="body">Explicit user action</text>
  <text x="393" y="831" class="body">POST /knowledge-graph</text>

  <rect x="680" y="735" width="300" height="135" class="box status"/>
  <text x="703" y="772" class="bt">Build registry</text>
  <text x="703" y="805" class="body">KnowledgeGraphBuildRegistry</text>
  <text x="703" y="831" class="body">not_built · building · built · failed</text>

  <rect x="1035" y="735" width="270" height="135" class="box amber"/>
  <text x="1058" y="772" class="bt">Read stored chunks</text>
  <text x="1058" y="805" class="body">buildKnowledgeGraph()</text>
  <text x="1058" y="831" class="body">Selected SQLite rows only</text>

  <rect x="1360" y="735" width="330" height="135" class="box purple"/>
  <text x="1383" y="772" class="bt">Entity extraction</text>
  <text x="1383" y="805" class="body">extractEntities()</text>
  <text x="1383" y="831" class="body">Dictionary · acronyms · proper names</text>

  <path d="M315 802 H370" class="purpleArrow"/><path d="M625 802 H680" class="purpleArrow"/><path d="M980 802 H1035" class="purpleArrow"/><path d="M1305 802 H1360" class="purpleArrow"/>

  <rect x="1035" y="940" width="270" height="135" class="box purple"/>
  <text x="1058" y="977" class="bt">Relationship extraction</text>
  <text x="1058" y="1010" class="body">extractRelations()</text>
  <text x="1058" y="1036" class="body">Rules, regex + co-occurrence</text>

  <rect x="1360" y="940" width="330" height="135" class="box purple"/>
  <text x="1383" y="977" class="bt">GraphStore</text>
  <text x="1383" y="1010" class="body">Document, chunk + entity nodes</text>
  <text x="1383" y="1036" class="body">MENTIONS, CONTAINS, domain edges</text>
  <path d="M1525 870 V910 H1170 V940" class="purpleArrow"/><path d="M1305 1007 H1360" class="purpleArrow"/>

  <rect x="75" y="940" width="500" height="185" class="box status"/>
  <text x="98" y="977" class="bt">Build signature + stale detection</text>
  <text x="98" y="1010" class="body">Document IDs · title · updatedAt</text>
  <text x="98" y="1036" class="body">KNOWLEDGE_GRAPH_BUILD_VERSION = 1</text>
  <text x="98" y="1075" class="body">A document/config change marks the graph</text>
  <text x="98" y="1101" class="body">as needing an explicit rebuild.</text>

  <rect x="650" y="940" width="300" height="185" class="box amber"/>
  <text x="673" y="977" class="bt">Compressed SQLite KG snapshot</text>
  <text x="673" y="1010" class="body">knowledge_graph_snapshots</text>
  <text x="673" y="1036" class="body">Nodes · edges · chunks · stats</text>
  <text x="673" y="1075" class="body">Restores GraphStore after restart</text>
  <text x="673" y="1101" class="body">No extraction or query-time rebuild</text>
  <path d="M575 1032 H650" class="arrow"/><path d="M1360 1055 H950" class="purpleArrow"/>
  <text x="965" y="1044" class="label">gzip snapshot / restore</text>

  <rect x="45" y="1270" width="1710" height="75" rx="18" fill="#fff" stroke="#cbd4e1" stroke-width="2"/>
  <text x="75" y="1316" class="bt">Key outcome:</text>
  <text x="210" y="1316" class="body">Build once from selected documents; restore the valid snapshot after restart and rebuild only when its signature is stale.</text>
</svg>
